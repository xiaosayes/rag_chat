# ============================================
# 文物知识库 RAG 系统 - Conda 环境配置
# 适用平台: Linux GPU Server (RTX 3090)
# 用法: conda env create -f environment.yml
# ============================================
name: cultural-relics-rag
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # === 基础 ===
  - python=3.10
  - pip>=23.0
  - setuptools>=68.0
  - wheel>=0.41

  # === CUDA 支持 (GPU 服务器, RTX 3090) ===
  # 注意: 如果版本冲突，可改用 pip 安装 PyTorch:
  #   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu118
  - cudatoolkit=11.8
  - pytorch=2.1.0
  - torchvision=0.16.0

  # === 数据处理 ===
  - numpy>=1.24.0
  - pandas>=2.1.0
  - pydantic>=2.5.0
  - pydantic-settings>=2.1.0

  # === 文档解析 ===
  - pypdf>=3.17.0
  - python-docx>=1.1.0
  - python-pptx>=0.6.23
  - markdown>=3.5.0
  - pytesseract>=0.3.10
  - Pillow>=10.1.0
  - opencv-python>=4.8.0

  # === OCR (PaddleOCR 对中文支持更好) ===
  - rapidfuzz>=3.0.0

  # === 检索 ===
  - scikit-learn>=1.5.0

  # === 工具 ===
  - python-dotenv>=1.0.0
  - tqdm>=4.66.0
  - rich>=13.7.0
  - loguru>=0.7.2
  - httpx>=0.27.0
  - aiohttp>=3.9.0

  # === Web UI ===
  - gradio>=4.44.0

  # === 测试 ===
  - pytest>=8.0.0
  - pytest-asyncio>=0.23.0

  # === pip 安装的包 ===
  - pip:
    # 阿里云百炼 SDK
    - dashscope>=1.20.0

    # 向量数据库
    - qdrant-client>=1.9.0

    # 备选 Embedding
    - sentence-transformers>=3.0.0

    # BM25 检索
    - rank-bm25>=0.2.2

    # 文档处理
    - langchain>=0.3.0
    - langchain-community>=0.3.0
    - langchain-text-splitters>=0.3.0

    # PaddleOCR (GPU 版，对中文 OCR 效果最好)
    - paddlepaddle-gpu>=2.6.0
    - paddleocr>=2.7.0

    # 图片 EXIF 读取
    - piexif>=1.1.3

    # 进度条增强
    - rich-progressify>=1.0.0